name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AZURE_CONTAINER_REGISTRY: customercorecr
  IMAGE_NAME: serverapirepo
  CONTAINER_APP_NAME: serverapicontainer
  RESOURCE_GROUP: rg-test
  CONTAINER_APP_ENVIRONMENT: serverapi-env
  LOCATION: australiasoutheast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: build
        run: dotnet build --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image for Snyk scan
        run: |
          docker build -t serverapi:snyk .

      - name: Run Snyk scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: serverapi:snyk
          args: --serverity-threshold=high --file=Dockerfile

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push container image to ACR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          file: Dockerfile

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container App environment exists
        shell: bash
        run: |
          az extension add --name containerapp --upgrade

          if ! az containerapp env show \
            --name "${{ env.CONTAINER_APP_ENVIRONMENT }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query name -o tsv >/dev/null 2>&1; then
            az containerapp env create \
              --name "${{ env.CONTAINER_APP_ENVIRONMENT }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --location "${{ env.LOCATION }}"
          fi

      - name: Ensure Container App exists
        shell: bash
        run: |
          if az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" >/dev/null 2>&1; then
            echo "Container app already exists"
          else
            az containerapp create \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --environment "${{ env.CONTAINER_APP_ENVIRONMENT }}" \
              --image "${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --target-port 8000 \
              --ingress external \
              --registry-server "${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
              --registry-username "${{ secrets.AZURE_REGISTRY_USERNAME }}" \
              --registry-password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"
          fi

      - name: Update app image
        shell: bash
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.AZURE_CONTAINER_REGISTRY}}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
